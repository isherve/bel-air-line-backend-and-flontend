<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BelAirLine</title>
<style>
  :root { --ink: #16263a; --muted: #5d6b7c; --line: #dfe5ec; --bg: #f4f6f9; --card: #fff; --brand: #0b4f8a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { background: var(--brand); color: #fff; padding: 20px 16px; }
  header h1 { margin: 0; font-size: 24px; }
  header p { margin: 2px 0 0; opacity: .85; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .tile b { display: block; font-size: 26px; }
  .tile span { color: var(--muted); font-size: 13px; }
  section { margin-top: 24px; }
  h2 { font-size: 17px; margin: 0 0 8px; }
  .wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-size: 13px; font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  .RESERVED { color: #8a5a00; } .PAID { color: #0b4f8a; } .TICKETED { color: #1b7a43; } .CANCELLED { color: #b3261e; }
  #error { color: #b3261e; }
</style>
</head>
<body>
<header>
  <h1>BelAirLine</h1>
  <p>Bookings overview</p>
</header>
<main>
  <p id="error" hidden></p>
  <div class="tiles" id="tiles"></div>
  <section><h2>Bookings</h2><div class="wrap" id="bookings"></div></section>
  <section><h2>Passengers</h2><div class="wrap" id="passengers"></div></section>
  <section><h2>Booking agents</h2><div class="wrap" id="agents"></div></section>
  <section><h2>Sales desks</h2><div class="wrap" id="desks"></div></section>
  <section><h2>Routes</h2><div class="wrap" id="routes"></div></section>
  <section><h2>Ancillary purchases</h2><div class="wrap" id="purchases"></div></section>
</main>
<script>
  const get = path => fetch('/api/' + path).then(r => r.json());

  function table(id, headers, rows) {
    const t = document.createElement('table');
    const head = t.insertRow();
    headers.forEach(h => {
      const th = document.createElement('th');
      th.textContent = h;
      head.appendChild(th);
    });
    rows.forEach(row => {
      const tr = t.insertRow();
      row.forEach(value => {
        const td = tr.insertCell();
        td.textContent = value;
        if (['RESERVED', 'PAID', 'TICKETED', 'CANCELLED'].includes(value)) td.className = value;
      });
    });
    document.getElementById(id).appendChild(t);
  }

  const person = p => p ? p.firstName + ' ' + p.lastName : '-';

  async function load() {
    const [summary, bookings, passengers, agents, desks, routes, unused, free] = await Promise.all([
      get('dashboard/summary'), get('bookings/all'), get('passengers/all'), get('booking-agents/all'),
      get('sales-desks/all'), get('routes/all'), get('routes/unused'), get('sales-desks/free')
    ]);

    const labels = { passengers: 'Passengers', agents: 'Booking agents', freeDesks: 'Free desks',
                     bookingsToday: 'Travelling today', reserved: 'Reserved', purchases: 'Purchases' };
    Object.keys(labels).forEach(key => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      const number = document.createElement('b');
      number.textContent = summary[key];
      const label = document.createElement('span');
      label.textContent = labels[key];
      tile.append(number, label);
      document.getElementById('tiles').appendChild(tile);
    });

    bookings.sort((a, b) => a.travelDate.localeCompare(b.travelDate));
    table('bookings', ['Travel date', 'Flight', 'Fare class', 'Status', 'Passenger', 'Agent'],
      bookings.map(b => [b.travelDate, b.flightNumber, b.fareClass, b.status, person(b.passenger), person(b.agent)]));

    table('passengers', ['Name', 'Passport', 'Email', 'Phone'],
      passengers.map(p => [person(p), p.passportNumber, p.email, p.phone]));

    table('agents', ['Name', 'Email', 'Sales desk', 'Routes'],
      agents.map(a => [person(a), a.email, a.salesDesk ? a.salesDesk.deskNumber + ' - ' + a.salesDesk.name : '-',
                       a.routes.map(r => r.name.replace('Kigali - ', '')).join(', ')]));

    const freeIds = free.map(d => d.id);
    desks.sort((a, b) => a.deskNumber - b.deskNumber);
    table('desks', ['Number', 'Name', 'State'],
      desks.map(d => [d.deskNumber, d.name, freeIds.includes(d.id) ? 'Free' : 'Taken']));

    const unusedIds = unused.map(r => r.id);
    table('routes', ['Route', 'State'],
      routes.map(r => [r.name, unusedIds.includes(r.id) ? 'Nobody holds it' : 'Held by an agent']));

    const purchases = (await Promise.all(passengers.map(p => get('ancillary-purchases/passenger/' + p.passportNumber)))).flat();
    table('purchases', ['Date', 'Item', 'Quantity', 'Note', 'Passenger', 'Flight'],
      purchases.map(d => [d.purchaseDate, d.itemName, d.quantity, d.note, person(d.booking.passenger), d.booking.flightNumber]));
  }

  load().catch(e => {
    const box = document.getElementById('error');
    box.hidden = false;
    box.textContent = 'Could not load the data: ' + e.message;
  });
</script>
</body>
</html>
